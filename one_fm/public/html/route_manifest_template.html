<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-FM Route Manifest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');
        :root {
            /* M3 Color Tokens (matching route_planner.js) */
            --md-sys-color-primary: #9a4500;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-surface: #ffffff;
            --md-sys-color-on-surface: #1f1f1f;
            --md-sys-color-on-surface-variant: #525252;
            --md-sys-color-outline: #737373;
            --md-sys-color-outline-variant: #e2e2e2;
            --md-sys-color-surface-container: #f4f4f5;
            --md-sys-color-surface-container-low: #fafafa;
            --md-sys-color-surface-container-high: #f0f0f0;
            --md-sys-color-surface-bright: #ffffff;
            --md-sys-color-error: #ba1a1a;
            --md-sys-color-error-container: #ffdad6;

            /* Semantic role colors */
            --rp-color-accent: #f97316;
            --rp-color-accent-dim: rgba(249, 115, 22, 0.15);
            --rp-color-accent-glow: rgba(249, 115, 22, 0.08);
            --rp-color-success: #22c55e;
            --rp-color-success-dim: rgba(34, 197, 94, 0.12);
            --rp-color-error: #ef4444;
            --rp-color-error-dim: rgba(239, 68, 68, 0.12);
            --rp-color-outbound: #1565c0;
            --rp-color-outbound-container: #dbeafe;
            --rp-color-return: #c2410c;
            --rp-color-return-container: #ffedd5;

            /* Legacy aliases for backward compat */
            --bg: var(--md-sys-color-surface-container);
            --bg-surface: var(--md-sys-color-surface-bright);
            --bg-card: var(--md-sys-color-surface-bright);
            --bg-raised: var(--md-sys-color-surface-container-low);
            --border: var(--md-sys-color-outline-variant);
            --border-light: var(--md-sys-color-surface-container-high);
            --accent: var(--rp-color-accent);
            --accent-dim: var(--rp-color-accent-dim);
            --accent-glow: var(--rp-color-accent-glow);
            --green: var(--rp-color-success);
            --green-dim: var(--rp-color-success-dim);
            --red: var(--rp-color-error);
            --red-dim: var(--rp-color-error-dim);
            --blue: var(--rp-color-outbound);
            --blue-dim: var(--rp-color-outbound-container);
            --purple: var(--rp-color-return);
            --purple-dim: var(--rp-color-return-container);
            --text: var(--md-sys-color-on-surface);
            --text-muted: var(--md-sys-color-on-surface-variant);
            --text-dim: var(--md-sys-color-outline);

            /* Typography — matches route_planner.js */
            --font-head: 'Google Sans', Roboto, sans-serif;
            --font-body: 'Google Sans', Roboto, sans-serif;
            --font-mono: 'Google Sans', Roboto, sans-serif;

            /* M3 Elevation */
            --md-sys-elevation-1: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
            --md-sys-elevation-2: 0 1px 2px rgba(0,0,0,0.3), 0 2px 6px 2px rgba(0,0,0,0.15);
            --md-sys-elevation-3: 0 4px 8px 3px rgba(0,0,0,0.15), 0 1px 3px rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 14px;
            min-height: 100vh;
        }

        /* ── HEADER ── */
        .header {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--md-sys-elevation-1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-family: var(--font-head);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--accent);
        }

        .logo span {
            color: var(--text-muted);
            font-weight: 400;
        }

        .run-meta {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 4px;
        }

        .summary-pills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-head);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.03em;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid;
        }

        .pill.vehicles {
            background: var(--blue-dim);
            border-color: var(--blue);
            color: var(--blue);
        }

        .pill.routes {
            background: var(--green-dim);
            border-color: var(--green);
            color: var(--green);
        }

        .pill.skipped {
            background: var(--red-dim);
            border-color: var(--red);
            color: var(--red);
        }

        .pill.cost {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent);
        }

        .pill-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        /* ── LAYOUT ── */
        .layout {
            display: flex;
            height: calc(100vh - 65px);
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 220px;
            min-width: 220px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px 0;
        }

        .sidebar-label {
            font-family: var(--font-head);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            padding: 0 16px 8px;
            text-transform: uppercase;
        }

        .vehicle-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px 16px;
            border-left: 3px solid transparent;
            transition: all 0.15s;
        }

        .vehicle-btn:hover {
            background: var(--bg-card);
        }

        .vehicle-btn.active {
            background: var(--accent-dim);
            border-left-color: var(--accent);
        }

        .vehicle-btn-label {
            font-family: var(--font-head);
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.02em;
            display: block;
        }

        .vehicle-btn.active .vehicle-btn-label {
            color: var(--accent);
        }

        .vehicle-btn-meta {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            display: block;
            margin-top: 2px;
        }

        .vehicle-btn-stops {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .sidebar-sep {
            height: 1px;
            background: var(--border);
            margin: 10px 16px;
        }

        .skipped-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px 16px;
            border-left: 3px solid transparent;
            transition: all 0.15s;
            color: var(--text-muted);
            font-family: var(--font-head);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .skipped-btn:hover {
            background: var(--bg-card);
        }

        .skipped-btn.active {
            background: var(--red-dim);
            border-left-color: var(--red);
            color: var(--red);
        }

        .badge {
            background: var(--red);
            color: white;
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: 500;
        }

        /* ── MAIN ── */
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px;
        }

        /* ── VEHICLE HEADER ── */
        .vehicle-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .vehicle-title {
            font-family: var(--font-head);
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--text);
            line-height: 1;
        }

        .vehicle-subtitle {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .vehicle-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .stat-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 16px;
            min-width: 100px;
        }

        .stat-val {
            font-family: var(--font-head);
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            line-height: 1;
        }

        .stat-lbl {
            font-family: var(--font-body);
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* ── TIMELINE ── */
        .timeline {
            position: relative;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 22px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--border);
        }

        .stop {
            position: relative;
            padding: 0 0 0 56px;
            margin-bottom: 6px;
        }

        .stop-dot {
            position: absolute;
            left: 14px;
            top: 14px;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            border: 2px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            background: var(--bg);
        }

        .stop-dot svg {
            width: 8px;
            height: 8px;
            fill: currentColor;
        }

        .stop-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 12px;
            transition: box-shadow 0.18s, border-color 0.18s, transform 0.14s;
            box-shadow: var(--md-sys-elevation-1);
        }

        .stop-card:hover {
            border-color: #d8d8d8;
            box-shadow: var(--md-sys-elevation-3);
            transform: translateY(-1px);
        }

        /* Type colours */
        .stop.depot .stop-dot {
            border-color: var(--text-dim);
            color: var(--text-dim);
        }

        .stop.pickup .stop-dot {
            border-color: var(--green);
            color: var(--green);
        }

        .stop.pickup .stop-card {
            border-left: 3px solid var(--green);
        }

        .stop.dropoff .stop-dot {
            border-color: var(--accent);
            color: var(--accent);
        }

        .stop.dropoff .stop-card {
            border-left: 3px solid var(--accent);
        }

        .stop.end .stop-dot {
            border-color: var(--text-dim);
            color: var(--text-dim);
        }

        .stop-type-tag {
            font-family: var(--font-head);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 3px;
            margin-right: 8px;
            display: inline-block;
        }

        .tag-pickup {
            background: var(--green-dim);
            color: var(--green);
        }

        .tag-dropoff {
            background: var(--accent-dim);
            color: var(--accent);
        }

        .tag-depot {
            background: var(--bg-raised);
            color: var(--text-dim);
        }

        .tag-return-leg {
            background: var(--purple-dim);
            color: var(--purple);
        }

        .tag-out-leg {
            background: var(--blue-dim);
            color: var(--blue);
        }

        .stop-main {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .stop-title {
            font-family: var(--font-head);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--text);
        }

        .stop-label-raw {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-dim);
        }

        .stop-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            white-space: nowrap;
        }

        .stop-site-location {
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
            margin-left: 8px;
            letter-spacing: 0;
        }

        .stop-time {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .stop-load {
            font-family: var(--font-head);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .load-up {
            color: var(--green);
        }

        .load-down {
            color: var(--accent);
        }

        .load-zero {
            color: var(--text-dim);
        }

        .transit-row {
            padding: 0 0 0 56px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .transit-line {
            flex: 1;
            height: 1px;
            background: repeating-linear-gradient(90deg,
                    var(--border) 0, var(--border) 6px,
                    transparent 6px, transparent 12px);
        }

        .transit-info {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-dim);
            white-space: nowrap;
        }

        /* ── SKIPPED PANEL ── */
        .skipped-panel {}

        .skipped-title {
            font-family: var(--font-head);
            font-size: 26px;
            font-weight: 700;
            color: var(--red);
            margin-bottom: 20px;
        }

        .skipped-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 3px solid var(--red);
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .skipped-label {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text);
            margin-bottom: 4px;
        }

        .skipped-reason {
            font-size: 12px;
            color: var(--text-muted);
        }

        .skipped-direction {
            font-family: var(--font-head);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            padding: 3px 8px;
            border-radius: 3px;
            white-space: nowrap;
            align-self: flex-start;
        }

        /* ── EMPTY ── */
        .empty-state {
            text-align: center;
            padding: 80px 40px;
            color: var(--text-muted);
        }

        .empty-state h2 {
            font-family: var(--font-head);
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 13px;
            line-height: 1.6;
        }
        /* ── MOBILE RESPONSIVE ── */
        @media (max-width: 767px) {
            /* Stack layout vertically */
            .layout {
                flex-direction: column;
                height: auto;
                min-height: calc(100vh - 65px);
            }

            /* Sidebar becomes horizontal scrollable strip */
            .sidebar {
                width: 100%;
                min-width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 8px 0;
                overflow-y: hidden;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                gap: 0;
            }

            .sidebar-label {
                display: none;
            }

            .sidebar-sep {
                display: none;
            }

            .vehicle-btn {
                display: inline-flex;
                flex-direction: column;
                align-items: flex-start;
                min-width: 120px;
                max-width: 140px;
                padding: 6px 12px;
                border-left: none;
                border-bottom: 3px solid transparent;
                flex-shrink: 0;
            }

            .vehicle-btn.active {
                border-left-color: transparent;
                border-bottom-color: var(--accent);
            }

            .vehicle-btn-label {
                font-size: 12px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 120px;
            }

            .vehicle-btn-meta {
                font-size: 9px;
            }

            .vehicle-btn-stops {
                font-size: 9px;
                margin-top: 2px;
            }

            .skipped-btn {
                display: inline-flex;
                min-width: 100px;
                padding: 6px 12px;
                font-size: 12px;
                border-left: none;
                border-bottom: 3px solid transparent;
                flex-shrink: 0;
            }

            .skipped-btn.active {
                border-bottom-color: var(--red);
            }

            /* Compact header */
            .header {
                padding: 10px 12px;
                flex-direction: column;
                gap: 8px;
                align-items: flex-start;
            }

            .header-left {
                gap: 8px;
                flex-wrap: wrap;
            }

            .logo {
                font-size: 16px;
            }

            .run-meta {
                font-size: 10px;
            }

            .summary-pills {
                gap: 6px;
            }

            .pill {
                font-size: 11px;
                padding: 3px 8px;
            }

            /* Main content */
            .main {
                padding: 14px 12px;
                overflow-y: visible;
            }

            /* Vehicle header */
            .vehicle-header {
                flex-direction: column;
                gap: 10px;
                margin-bottom: 16px;
            }

            .vehicle-title {
                font-size: 20px;
            }

            .vehicle-subtitle {
                font-size: 10px;
            }

            .vehicle-stats {
                gap: 8px;
                width: 100%;
            }

            .stat-box {
                padding: 8px 10px;
                min-width: 80px;
                flex: 1;
            }

            .stat-val {
                font-size: 16px;
            }

            .stat-lbl {
                font-size: 9px;
            }

            /* Timeline */
            .timeline::before {
                left: 12px;
            }

            .stop {
                padding-left: 36px;
            }

            .stop-dot {
                left: 5px;
                top: 12px;
                width: 15px;
                height: 15px;
            }

            .stop-card {
                grid-template-columns: 1fr;
                gap: 6px;
                padding: 10px 12px;
            }

            .stop-right {
                flex-direction: row;
                align-items: center;
                gap: 8px;
                white-space: normal;
            }

            .stop-title {
                font-size: 13px;
            }

            .stop-time {
                font-size: 12px;
            }

            .stop-type-tag {
                font-size: 9px;
                padding: 1px 5px;
            }

            .transit-row {
                padding-left: 36px;
            }

            /* Trip groups */
            .trip-group {
                margin-left: 36px;
            }

            /* Skipped panel */
            .skipped-title {
                font-size: 18px;
            }

            .skipped-item {
                flex-direction: column;
                gap: 6px;
            }

            /* Empty state */
            .empty-state {
                padding: 40px 20px;
            }

            .empty-state h2 {
                font-size: 18px;
            }
        }

        /* Tablet tweaks */
        @media (min-width: 768px) and (max-width: 1023px) {
            .sidebar {
                width: 180px;
                min-width: 180px;
            }

            .header {
                padding: 12px 20px;
            }

            .main {
                padding: 20px 20px;
            }

            .vehicle-title {
                font-size: 26px;
            }
        }

        /* ── PRINT ── */
        @media print {

            .sidebar,
            .header {
                display: none;
            }

            .main {
                padding: 20px;
                overflow: visible;
            }

            .layout {
                height: auto;
            }

            body {
                background: white;
                color: black;
            }

            .stop-card,
            .stat-box {
                border-color: #ccc;
                background: white;
            }
        }

        .stop-employees {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 5px;
        }

        .emp-chip {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 2px 6px;
        }

        /* ── TRIP GROUP ── */
        .trip-group {
            border: 2px solid var(--blue);
            border-radius: 12px;
            margin: 16px 0 16px 46px;
            padding: 0;
            position: relative;
            background: rgba(21, 101, 192, 0.02);
        }

        .trip-group.outbound {
            border-color: var(--blue);
            background: rgba(21, 101, 192, 0.02);
        }

        .trip-group.return {
            border-color: var(--purple);
            background: rgba(194, 65, 12, 0.02);
        }

        .trip-group-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-raised);
            border-radius: 10px 10px 0 0;
        }

        .trip-group-title {
            font-family: var(--font-head);
            font-size: 13px;
            font-weight: 700;
            color: var(--blue);
            letter-spacing: 0.04em;
        }

        .trip-group.return .trip-group-title {
            color: var(--purple);
        }

        .trip-group-meta {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-dim);
        }

        .trip-group .stop {
            padding-left: 16px;
        }

        .trip-group .transit-row {
            padding-left: 16px;
        }

        .trip-group .timeline::before {
            display: none;
        }
    </style>
</head>

<body>

    <script>

        function fmtTime(isoStr) {
            if (!isoStr) return "—";
            const d = new Date(isoStr);
            return d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Kuwait" });
        }

        function fmtDuration(secStr) {
            if (!secStr) return "";
            const s = parseInt(secStr.replace("s", ""), 10);
            if (isNaN(s) || s === 0) return "";
            if (s < 60) return `${s}s`;
            if (s < 3600) return `${Math.round(s / 60)}m`;
            const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
            return m ? `${h}h ${m}m` : `${h}h`;
        }

        function fmtKm(m) {
            return m >= 1000 ? `${(m / 1000).toFixed(1)} km` : `${m} m`;
        }

        function parseLabel(label) {
            // Pattern: {acc}_{shift}_{location}_{OUTBOUND|RETURN}
            const parts = label.split("_");
            const direction = parts[parts.length - 1]; // OUTBOUND or RETURN
            const location = parts.slice(0, -1).join("_").split("_").slice(2).join(" ");
            const acc = parts[0];
            return { acc, location, direction, raw: label };
        }

        function seatsLoad(demands) {
            if (!demands) return 0;
            const raw = demands.seats?.amount ?? "0";
            return parseInt(raw, 10) || 0;
        }

        function buildRoute(route, shipments, vehicles) {
            const vidx = route.vehicleIndex ?? 0;
            const vehicle = vehicles[vidx] ?? {};
            const label = route.vehicleLabel ?? vehicle.label ?? `Vehicle ${vidx}`;
            const startLoc = vehicle.startLocation;
            const vehicleMeta = (ROUTE_DATA.vehicleMeta ?? {})[label] ?? {};  // ← add this

            let currentLoad = 0;
            const visits = route.visits ?? [];
            const trans = route.transitions ?? [];
            const stops = [];

            // ── Depot START ──
            stops.push({
                type: "depot",
                time: route.vehicleStartTime,
                title: vehicleMeta.accommodation || vehicleMeta.location || "Depot / Garage",
                depotNote: "Vehicle start location - Employee pick-up starts here",
                subtitle: startLoc
                    ? `${startLoc.latitude.toFixed(4)}, ${startLoc.longitude.toFixed(4)}`
                    : "Start location",
                load: 0,
                transition: trans[0]
            });

            visits.forEach((v, i) => {
                const shipment = shipments[v.shipmentIndex] ?? {};
                const isRest = (shipment.label ?? "").endsWith("_REST");
                const isPickup = v.isPickup !== false;
                const delta = seatsLoad(v.loadDemands);
                currentLoad += delta;

                const parsed = parseLabel(shipment.label ?? "Unknown");
                const visitReq = isPickup
                    ? (shipment.pickups?.[0] ?? {})
                    : (shipment.deliveries?.[0] ?? {});
                const coords = visitReq.arrivalLocation;

                stops.push({
                    type: isPickup ? "pickup" : "dropoff",
                    isRest: isRest,
                    time: v.startTime,
                    title: isRest ? `Rest at ${vehicleMeta.accommodation || vehicleMeta.location || "Depot"}` : (shipmentSiteLocations[parsed.raw] || parsed.location || shipment.label), subtitle: coords ? `${coords.latitude.toFixed(4)}, ${coords.longitude.toFixed(4)}` : "",
                    direction: parsed.direction,
                    acc: parsed.acc,
                    raw: parsed.raw,
                    load: currentLoad,
                    delta: delta,
                    transition: trans[i + 1],
                    tripId: v.tripId || null,
                    tripName: v.tripName || null,
                    stopIndex: v.stopIndex || 0
                });
            });

            // ── Depot END ──
            stops.push({
                type: "end",
                time: route.vehicleEndTime,
                title: `Return to ${vehicleMeta.accommodation || vehicleMeta.location || "Depot"}`,
                load: 0
            });

            return { label, stops, route, vehicle };
        }

        // ════════════════════════════════════════════════════════════════════
        //  RENDER
        // ════════════════════════════════════════════════════════════════════

        let shipmentEmployees = {};
        let shipmentReturnEmployees = {};
        let shipmentSiteLocations = {};
        let shipmentShiftNames = {};

        function init() {
            const req = ROUTE_DATA.request;
            const res = ROUTE_DATA.response;
            const shipments = req.model.shipments ?? [];
            const vehicles = req.model.vehicles ?? [];
            const routes = res.routes ?? [];
            const skipped = res.skippedShipments ?? [];
            const metrics = res.metrics ?? {};

            shipmentEmployees = ROUTE_DATA.shipmentEmployees ?? {};
            shipmentReturnEmployees = ROUTE_DATA.shipmentReturnEmployees ?? {};
            shipmentSiteLocations = ROUTE_DATA.shipmentSiteLocations ?? {};
            shipmentShiftNames = ROUTE_DATA.shipmentShiftNames ?? {};

            // Build parsed routes
            const parsed = routes.map(r => buildRoute(r, shipments, vehicles));

            // Header summary
            document.getElementById("pill-vehicles").textContent = vehicles.length + " Vehicles";
            document.getElementById("pill-routes").textContent = parsed.length + " Active";
            document.getElementById("pill-skipped").textContent = skipped.length + " Skipped";
            const cost = metrics.totalCost ?? metrics.aggregatedRouteMetrics?.totalCost ?? 0;
            document.getElementById("pill-cost").textContent = cost
                ? "KD " + Number(cost).toLocaleString("en-KW", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                : "—";

            // Detect run date from first visit
            const firstTime = routes[0]?.vehicleStartTime ?? req.model.globalStartTime;
            if (firstTime) {
                const d = new Date(firstTime);
                document.getElementById("run-meta").textContent =
                    d.toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short", year: "numeric", timeZone: "Asia/Kuwait" })
                    + " · Kuwait Time";
            }

            // Sidebar
            const sidebar = document.getElementById("sidebar-routes");
            sidebar.innerHTML = "";

            parsed.forEach((pr, idx) => {
                const m = pr.route.metrics ?? {};
                const meta = (ROUTE_DATA.vehicleMeta ?? {})[pr.label] ?? {};
                const btn = document.createElement("button");
                btn.className = "vehicle-btn";
                const stopCount = (pr.route.visits ?? []).length;
                const dist = m.travelDistanceMeters ? fmtKm(m.travelDistanceMeters) : "";
                const dur = m.totalDuration ? fmtDuration(m.totalDuration) : "";
                btn.innerHTML = `
      <span class="vehicle-btn-label">${pr.label}</span>
      <span class="vehicle-btn-meta">${fmtTime(pr.route.vehicleStartTime)} → ${fmtTime(pr.route.vehicleEndTime)}</span>
      <span class="vehicle-btn-stops">
        <span>${stopCount} stops</span>
        ${dist ? `<span>·</span><span>${dist}</span>` : ""}
        ${dur ? `<span>·</span><span>${dur}</span>` : ""}
      </span>
      ${meta.driver ? `<span class="vehicle-btn-meta" style="margin-top:5px;color:var(--text-muted)"><span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle">person</span> ${meta.driver}</span>` : ""}
      ${meta.make || meta.type ? `<span class="vehicle-btn-meta">${[meta.make, meta.type].filter(Boolean).join(' · ')}</span>` : ""}
      ${meta.seats ? `<span class="vehicle-btn-meta"><span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle">event_seat</span> ${meta.seats} seats</span>` : ""}
    `;
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".vehicle-btn").forEach(b => b.classList.remove("active"));
                    document.querySelectorAll(".skipped-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    renderRoute(pr);
                });
                sidebar.appendChild(btn);
                if (idx === 0) {
                    btn.classList.add("active");
                    activeView = pr;
                }
            });

            // Skipped button
            if (skipped.length > 0) {
                const sep = document.createElement("div");
                sep.className = "sidebar-sep";
                sidebar.appendChild(sep);

                const sk = document.createElement("button");
                sk.className = "skipped-btn";
                sk.innerHTML = `<span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle">warning</span> Skipped <span class="badge">${skipped.length}</span>`;
                sk.addEventListener("click", () => {
                    document.querySelectorAll(".vehicle-btn").forEach(b => b.classList.remove("active"));
                    document.querySelectorAll(".skipped-btn").forEach(b => b.classList.remove("active"));
                    sk.classList.add("active");
                    renderSkipped(skipped);
                });
                sidebar.appendChild(sk);
            }

            // Render first vehicle
            if (parsed.length > 0) {
                renderRoute(parsed[0]);
            } else {
                document.getElementById("main").innerHTML = `
      <div class="empty-state">
        <h2>No routes found</h2>
        <p>The API returned no routes. Check the solvingMode and constraints,<br>or examine the skippedShipments section.</p>
      </div>`;
            }
        }

        function stopDotSVG(type) {
            if (type === "pickup") return `<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4"/></svg>`;
            if (type === "dropoff") return `<svg viewBox="0 0 10 10"><path d="M5 1l4 8H1z"/></svg>`;
            return `<svg viewBox="0 0 10 10"><rect x="2" y="2" width="6" height="6"/></svg>`;
        }

        function renderRoute(pr) {
            const m = pr.route.metrics ?? {};
            const totalShipments = Math.ceil((pr.route.visits ?? []).length / 2);
            const dist = m.travelDistanceMeters ? fmtKm(m.travelDistanceMeters) : "—";
            const dur = m.totalDuration ? fmtDuration(m.totalDuration) : "—";
            const trav = m.travelDuration ? fmtDuration(m.travelDuration) : "—";
            const meta = (ROUTE_DATA.vehicleMeta ?? {})[pr.label] ?? {};
            const accommodation = meta.accommodation || meta.location || "Depot";
            const metaStats = `
    ${meta.driver ? `<div class="stat-box"><div class="stat-val" style="font-size:15px">${meta.driver}</div><div class="stat-lbl">Driver</div></div>` : ""}
    ${meta.make ? `<div class="stat-box"><div class="stat-val" style="font-size:15px">${meta.make}</div><div class="stat-lbl">Make</div></div>` : ""}
    ${meta.type ? `<div class="stat-box"><div class="stat-val" style="font-size:15px">${meta.type}</div><div class="stat-lbl">Type</div></div>` : ""}
    ${meta.seats ? `<div class="stat-box"><div class="stat-val">${meta.seats}</div><div class="stat-lbl">Seats</div></div>` : ""}
  `;

            // ── Split stops into trips ──
            // Group non-depot stops by tripId
            const tripMap = {};   // tripId → [stop, ...]
            const soloStops = []; // stops without a tripId (non-depot)
            let depotStart = null;
            let depotEnd = null;

            pr.stops.forEach((stop, idx) => {
                if (stop.type === 'depot') { depotStart = stop; return; }
                if (stop.type === 'end') { depotEnd = stop; return; }
                if (stop.tripId) {
                    if (!tripMap[stop.tripId]) tripMap[stop.tripId] = [];
                    tripMap[stop.tripId].push(stop);
                } else {
                    soloStops.push(stop);
                }
            });

            const tripIds = Object.keys(tripMap);
            // Group solo stops into a pseudo-trip if they exist
            const allTrips = [];
            tripIds.forEach((tid, i) => {
                const tripStops = tripMap[tid];
                const name = tripStops.find(s => s.tripName)?.tripName || `Trip ${i + 1}`;
                allTrips.push({ id: tid, label: name, stops: tripStops });
            });
            if (soloStops.length > 0) {
                allTrips.push({ id: null, label: allTrips.length > 0 ? `Trip ${allTrips.length + 1} (Independent)` : 'Trip 1', stops: soloStops });
            }

            // If there's only one group with no tripId differentiation, fall back
            if (allTrips.length === 0 && depotStart) {
                allTrips.push({ id: null, label: 'Trip 1', stops: pr.stops.filter(s => s.type !== 'depot' && s.type !== 'end') });
            }

            let html = `
  <div class="vehicle-header">
    <div>
      <div class="vehicle-title">${pr.label}</div>
      <div class="vehicle-subtitle">${fmtTime(pr.route.vehicleStartTime)} → ${fmtTime(pr.route.vehicleEndTime)} · ${allTrips.length} trip${allTrips.length !== 1 ? 's' : ''}</div>
    </div>
      <div class="vehicle-stats">
        <div class="stat-box">
          <div class="stat-val">${totalShipments}</div>
          <div class="stat-lbl">Shipments</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${allTrips.length}</div>
          <div class="stat-lbl">Trips</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${dur}</div>
          <div class="stat-lbl">Total Time</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${trav}</div>
          <div class="stat-lbl">Drive Time</div>
        </div>
        ${metaStats}
      </div>
  </div>`;

            // ── Render each trip as a self-contained section ──
            allTrips.forEach((trip, ti) => {
                const tripStops = trip.stops;
                if (!tripStops.length) return;

                function calcTransit(t1, t2) {
                    const ms = new Date(t2).getTime() - new Date(t1).getTime();
                    if (ms <= 0) return { travelDuration: '0s', waitDuration: '0s', travelDistanceMeters: 0 };
                    return { travelDuration: Math.round(ms / 1000) + 's', waitDuration: '0s', travelDistanceMeters: 0 };
                }

                // ── Pair stops: at each site, DROP OFF first then PICK UP ──
                const actualSiteStops = [];
                tripStops.forEach(stop => {
                    if (stop.direction === 'OUTBOUND' && stop.type === 'pickup') return;
                    if (stop.direction === 'RETURN' && stop.type === 'dropoff') return;
                    
                    actualSiteStops.push(stop);

                    if (stop.direction === 'OUTBOUND' && stop.type === 'dropoff') {
                        const retEmps = shipmentReturnEmployees[stop.raw] || [];
                        if (retEmps.length > 0) {
                            actualSiteStops.push({
                                ...stop,
                                type: 'pickup',
                                _isVirtualReturn: true,
                                _virtualEmps: retEmps
                            });
                        }
                    }
                });

                const siteStops = {}; // site → { dropoffs: [], pickups: [] }
                actualSiteStops.forEach(stop => {
                    const site = shipmentSiteLocations[stop.raw] || stop.title || 'Unknown';
                    if (!siteStops[site]) siteStops[site] = { dropoffs: [], pickups: [] };
                    if (stop.type === 'dropoff') siteStops[site].dropoffs.push(stop);
                    else if (stop.type === 'pickup') siteStops[site].pickups.push(stop);
                });

                // Sort sites by earliest stop time
                const siteOrder = Object.entries(siteStops)
                    .map(([site, data]) => {
                        const allS = [...data.dropoffs, ...data.pickups];
                        const earliest = allS.reduce((m, s) => Math.min(m, new Date(s.time).getTime()), Infinity);
                        return { site, data, earliest };
                    })
                    .sort((a, b) => a.earliest - b.earliest);

                // Build paired stop list: for each site, dropoffs first then pickups
                const orderedStops = []; // { stop, siteNum }
                siteOrder.forEach(({ site, data }, siteIdx) => {
                    const siteNum = siteIdx + 1;
                    data.dropoffs.sort((a, b) => new Date(a.time) - new Date(b.time));
                    data.pickups.sort((a, b) => new Date(a.time) - new Date(b.time));
                    const maxLen = Math.max(data.dropoffs.length, data.pickups.length);
                    for (let i = 0; i < maxLen; i++) {
                        if (i < data.dropoffs.length) orderedStops.push({ stop: data.dropoffs[i], siteNum });
                        if (i < data.pickups.length) orderedStops.push({ stop: data.pickups[i], siteNum });
                    }
                });

                const firstTime = tripStops.reduce((min, s) => {
                    const t = new Date(s.time).getTime();
                    return t < min ? t : min;
                }, Infinity);
                const lastTime = tripStops.reduce((max, s) => {
                    const t = new Date(s.time).getTime();
                    return t > max ? t : max;
                }, 0);
                const firstTimeISO = new Date(firstTime).toISOString();
                const lastTimeISO = new Date(lastTime).toISOString();

                const hasOutbound = tripStops.some(s => s.direction === 'OUTBOUND');
                const hasReturn = tripStops.some(s => s.direction === 'RETURN');
                const dirClass = !hasOutbound && hasReturn ? 'return' : 'outbound';
                const dirEmoji = !hasOutbound && hasReturn ? '←' : '→';

                html += `
  <div class="trip-group ${dirClass}" style="margin-left:0">
    <div class="trip-group-header">
      <span class="trip-group-title">${dirEmoji} ${trip.label}</span>
      <span class="trip-group-meta">${siteOrder.length} site${siteOrder.length !== 1 ? 's' : ''} · ${fmtTime(firstTimeISO)} → ${fmtTime(lastTimeISO)}</span>
    </div>
    <div class="timeline" style="padding:12px 0 12px 10px">`;

                // Boarding employees for DEPART (all dropoff employees board at accommodation)
                const boardingEmployees = [];
                orderedStops.forEach(item => {
                    if (item.stop.type === 'dropoff') {
                        (shipmentEmployees[item.stop.raw] ?? []).forEach(e => {
                            if (!boardingEmployees.includes(e)) boardingEmployees.push(e);
                        });
                    }
                });

                // DEPART stop
                html += renderStop({
                    type: 'depot',
                    time: firstTimeISO,
                    title: accommodation,
                    depotNote: `Vehicle departs — ${boardingEmployees.length} employee${boardingEmployees.length !== 1 ? 's' : ''} boarding`,
                    load: 0,
                    _allEmployees: boardingEmployees
                }, 0, orderedStops.length + 2);

                const firstSiteStop = orderedStops[0]?.stop;
                if (firstSiteStop) {
                    html += renderTransit(calcTransit(firstTimeISO, firstSiteStop.time));
                } else {
                    html += renderTransit({ travelDuration: '0s', waitDuration: '0s', travelDistanceMeters: 0 });
                }

                // ── Each stop individually ──
                orderedStops.forEach((item, si) => {
                    const stop = item.stop;
                    const siteNum = item.siteNum;
                    const site = shipmentSiteLocations[stop.raw] || stop.title || 'Unknown';
                    const emps = stop._isVirtualReturn ? stop._virtualEmps : (shipmentEmployees[stop.raw] ?? []);
                    const shift = shipmentShiftNames[stop.raw] || '';
                    const isDropoff = stop.type === 'dropoff';
                    const stopType = isDropoff ? 'dropoff' : 'pickup';

                    let empHtml = '';
                    if (emps.length > 0 && isDropoff) {
                        empHtml = `<div style="margin-top:6px">
                            <div style="font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">
                                <span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle">arrow_downward</span> Dropping off — ${emps.length} employee${emps.length !== 1 ? 's' : ''}
                            </div>
                            <div class="stop-employees">${emps.map(n => `<span class="emp-chip" style="border-color:var(--accent);color:var(--accent)">${n}</span>`).join("")}</div>
                        </div>`;
                    } else if (emps.length > 0) {
                        empHtml = `<div style="margin-top:6px">
                            <div style="font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">
                                <span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle">arrow_upward</span> Picking up — ${emps.length} employee${emps.length !== 1 ? 's' : ''}
                            </div>
                            <div class="stop-employees">${emps.map(n => `<span class="emp-chip" style="border-color:var(--green);color:var(--green)">${n}</span>`).join("")}</div>
                        </div>`;
                    }

                    html += `
    <div class="stop ${stopType}">
      <div class="stop-dot">${stopDotSVG(stopType)}</div>
      <div class="stop-card">
        <div class="stop-main">
          <div>
            ${isDropoff ? '<span class="stop-type-tag tag-dropoff">DROP OFF</span>' : '<span class="stop-type-tag tag-pickup">PICK UP</span>'}
            <span class="stop-type-tag tag-depot">STOP ${siteNum}</span>
          </div>
          <div class="stop-title">${site}</div>
          ${shift ? `<div class="stop-label-raw" style="color:var(--text-muted)">${shift}</div>` : ''}
          ${empHtml}
        </div>
        <div class="stop-right">
          <div class="stop-time">${fmtTime(stop.time)}</div>
          ${isDropoff
            ? `<div class="stop-load load-down">-${emps.length} dropped</div>`
            : `<div class="stop-load load-up">+${emps.length} picked up</div>`}
        </div>
      </div>
    </div>`;

                    if (si < orderedStops.length - 1) {
                        const nextStop = orderedStops[si + 1].stop;
                        if (item.siteNum === orderedStops[si + 1].siteNum) {
                            html += renderTransit({ travelDuration: '0s', waitDuration: '0s', travelDistanceMeters: 0 });
                        } else {
                            html += renderTransit(calcTransit(stop.time, nextStop.time));
                        }
                    }
                });

                // RETURN stop
                const returningEmployees = [];
                orderedStops.forEach(item => {
                    if (item.stop.type === 'pickup') {
                        const stopEmps = item.stop._isVirtualReturn ? item.stop._virtualEmps : (shipmentEmployees[item.stop.raw] ?? []);
                        stopEmps.forEach(e => {
                            if (!returningEmployees.includes(e)) returningEmployees.push(e);
                        });
                    }
                });

                const lastSiteStop = orderedStops[orderedStops.length - 1]?.stop;
                if (lastSiteStop) {
                    html += renderTransit(calcTransit(lastSiteStop.time, lastTimeISO));
                } else {
                    html += renderTransit({ travelDuration: '0s', waitDuration: '0s', travelDistanceMeters: 0 });
                }
                html += renderStop({
                    type: 'end',
                    time: lastTimeISO,
                    title: `Return to ${accommodation}`,
                    depotNote: returningEmployees.length > 0 ? `Returning ${returningEmployees.length} employee${returningEmployees.length !== 1 ? 's' : ''} to accommodation` : '',
                    load: 0,
                    _allEmployees: returningEmployees
                }, orderedStops.length + 1, orderedStops.length + 2);

                html += `</div></div>`;

                if (ti < allTrips.length - 1) {
                    html += `<div style="height:8px"></div>`;
                }
            });

            document.getElementById("main").innerHTML = html;
        }

        function renderStop(stop, idx, totalStops) {
            const isFirst = idx === 0;
            const isLast = idx === totalStops - 1;
            const dot = stop.type === "depot" || stop.type === "end" ? "depot" : stop.type;

            let tags = "";
            if (stop.isRest) tags += `<span class="stop-type-tag tag-depot">REST</span>`;
            if (stop.type === "pickup") {
                tags += `<span class="stop-type-tag tag-pickup">PICK UP</span>`;
            } else if (stop.type === "dropoff") {
                tags += `<span class="stop-type-tag tag-dropoff">DROP OFF</span>`;
            } else if (isFirst) {
                tags += `<span class="stop-type-tag tag-depot">DEPART</span>`;
            } else if (isLast) {
                tags += `<span class="stop-type-tag tag-depot">RETURN</span>`;
            }
            if (stop.direction === "OUTBOUND") {
                tags += `<span class="stop-type-tag tag-out-leg">TO SITE</span>`;
            } else if (stop.direction === "RETURN") {
                tags += `<span class="stop-type-tag tag-return-leg">FROM SITE</span>`;
            }
            if (stop.stopIndex) {
                tags += `<span class="stop-type-tag tag-depot">STOP ${stop.stopIndex}</span>`;
            }

            let loadHtml = "";
            if (stop.type === "pickup" && stop.delta) {
                loadHtml = `<div class="stop-load load-up">+${stop.delta} picked up → ${stop.load} total</div>`;
            } else if (stop.type === "dropoff" && stop.delta) {
                loadHtml = `<div class="stop-load load-down">${stop.delta} dropped off → ${stop.load} onboard</div>`;
            } else if (stop.load === 0 && (stop.type === "depot" || stop.type === "end")) {
                loadHtml = `<div class="stop-load load-zero">0 onboard</div>`;
            }

            return `
    <div class="stop ${stop.type}">
      <div class="stop-dot">${stopDotSVG(dot)}</div>
      <div class="stop-card">
        <div class="stop-main">
          <div>${tags}</div>
          <div class="stop-title">${stop.title}</div>
          ${stop.depotNote ? `<div class="stop-label-raw" style="color:var(--green)">${stop.depotNote}</div>` : ""}
          ${shipmentShiftNames[stop.raw] && !stop.isRest && stop.type !== "depot" && stop.type !== "end"
                        ? `<div class="stop-label-raw" style="color:var(--text-muted)">${shipmentShiftNames[stop.raw]}</div>`
                        : ""}
          ${stop.acc && stop.type !== "depot" && stop.type !== "end"
                        ? `<div class="stop-label-raw">${stop.direction === "RETURN" && stop.type === "dropoff" ? `<span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle">arrow_downward</span> Dropping off at ${stop.acc}` : stop.acc}</div>`
                        : (stop.subtitle ? `<div class="stop-label-raw">${stop.subtitle}</div>` : "")}
          ${(() => {
                // Contextual employee display
                const stopEmps = shipmentEmployees[stop.raw] ?? [];
                const allEmps = stop._allEmployees ?? [];
                let empHtml = '';

                if (allEmps.length > 0) {
                    // DEPART card — show all employees boarding
                    empHtml = `<div style="margin-top:6px">
                        <div style="font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">
                            <span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle">directions_bus</span> Onboarding — ${allEmps.length} employee${allEmps.length !== 1 ? 's' : ''}
                        </div>
                        <div class="stop-employees">${allEmps.map(n => `<span class="emp-chip">${n}</span>`).join("")}</div>
                    </div>`;
                } else if (stopEmps.length > 0) {
                    if (stop.type === 'dropoff') {
                        empHtml = `<div style="margin-top:6px">
                            <div style="font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">
                                <span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle">arrow_downward</span> Dropping off — ${stopEmps.length} employee${stopEmps.length !== 1 ? 's' : ''}
                            </div>
                            <div class="stop-employees">${stopEmps.map(n => `<span class="emp-chip" style="border-color:var(--accent);color:var(--accent)">${n}</span>`).join("")}</div>
                        </div>`;
                    } else if (stop.type === 'pickup') {
                        empHtml = `<div style="margin-top:6px">
                            <div style="font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px">
                                <span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle">arrow_upward</span> Picking up — ${stopEmps.length} employee${stopEmps.length !== 1 ? 's' : ''}
                            </div>
                            <div class="stop-employees">${stopEmps.map(n => `<span class="emp-chip" style="border-color:var(--green);color:var(--green)">${n}</span>`).join("")}</div>
                        </div>`;
                    }
                }
                return empHtml;
            })()}
        </div>
        <div class="stop-right">
          <div class="stop-time">${fmtTime(stop.time)}</div>
          ${loadHtml}
        </div>
      </div>
    </div>`;
        }

        function renderTransit(t) {
            const d = fmtDuration(t.travelDuration);
            const w = fmtDuration(t.waitDuration);
            const km = t.travelDistanceMeters ? fmtKm(t.travelDistanceMeters) : "";
            const parts = [];
            if (d) parts.push(`<span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle">directions_bus</span> ${d}`);
            if (km) parts.push(km);
            if (w && w !== "0s") parts.push(`<span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle">hourglass_top</span> wait ${w}`);
            return `
        <div class="transit-row">
          <div class="transit-line"></div>
          <div class="transit-info">${parts.join(" · ") || "—"}</div>
          <div class="transit-line"></div>
        </div>`;
        }

        function renderSkipped(skipped) {
            let html = `<div class="skipped-panel"><div class="skipped-title"><span class="material-symbols-outlined" style="font-size:24px;vertical-align:middle">warning</span> Skipped Shipments (${skipped.length})</div>`;
            skipped.forEach(s => {
                const parsed = s.label ? parseLabel(s.label) : null;
                const reasons = (s.reasons ?? []).map(r => r.code ?? r.exampleVehicleIndex ?? JSON.stringify(r)).join(", ");
                const dirTag = parsed
                    ? `<span class="skipped-direction ${parsed.direction === "OUTBOUND" ? "tag-out-leg" : "tag-return-leg"}">${parsed.direction}</span>`
                    : "";
                html += `
      <div class="skipped-item">
        <div>
          <div class="skipped-label">${s.label ?? "Unlabelled shipment"}</div>
          <div class="skipped-reason">${reasons || "No reason provided"}</div>
        </div>
        ${dirTag}
      </div>`;
            });
            html += `</div>`;
            document.getElementById("main").innerHTML = html;
        }

        window.addEventListener("DOMContentLoaded", init);
    </script>

    <!-- ──────────────────────────── HTML ──────────────────────────── -->
    <div class="header">
        <div class="header-left">
            <div class="logo">ONE-FM <span>/ Route Manifest</span></div>
            <div class="run-meta" id="run-meta">—</div>
        </div>
        <div class="summary-pills">
            <div class="pill vehicles"><span class="pill-dot"></span><span id="pill-vehicles">—</span></div>
            <div class="pill routes"><span class="pill-dot"></span><span id="pill-routes">—</span></div>
            <div class="pill skipped"><span class="pill-dot"></span><span id="pill-skipped">0 Skipped</span></div>
            <div class="pill cost"><span class="pill-dot"></span><span id="pill-cost">—</span></div>
        </div>
    </div>

    <div class="layout">
        <nav class="sidebar">
            <div class="sidebar-label">Vehicles</div>
            <div id="sidebar-routes"></div>
        </nav>
        <main class="main" id="main"></main>
    </div>

</body>

</html>
