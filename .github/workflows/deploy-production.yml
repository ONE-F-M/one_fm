name: Deploy hotfix to Production

on:
  workflow_dispatch:
  pull_request:
    branches: [version-15]
    types: [closed, labeled]

# The job only opens an SSH session, so the token needs no access.
permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs deploy only from version-15; PR runs only for a merged PR into version-15 labelled deploy-hotfix.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/version-15') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'deploy-hotfix'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Deploy version-15 to Production
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_KEY }}
          port: 22
          command_timeout: 60m
          script_stop: true
          script: |
            set -ex
            # Non-interactive SSH does not load ~/.profile or nvm.
            export PATH="$HOME/.local/bin:$PATH"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            command -v bench && bench --version
            command -v node && node --version
            command -v yarn && yarn --version

            BENCH=/home/frappe/frappe-bench
            NAME="$(basename "$BENCH")"
            # facerec and redis run on this server too and are left alone.
            WORKERS="$NAME-workers: $NAME-bpmn-workers:"
            # One deploy at a time per bench, across one_fm, one_bpmn and frappe_agile.
            exec 9>"$BENCH/config/deploy.lock"
            flock -w 1500 9

            # A running long job holds the stop below for up to stopwaitsecs with every worker down.
            REDIS_QUEUE="$(jq -r .redis_queue $BENCH/sites/common_site_config.json)"
            LONG_RUNNING="rq:wip:home-frappe-frappe-bench:long"
            for attempt in $(seq 1 40); do
              JOB="$(redis-cli -u "$REDIS_QUEUE" zrangebyscore "$LONG_RUNNING" "$(date +%s)" +inf limit 0 1)"
              if [ -z "$JOB" ]; then break; fi
              echo "Long job $JOB running since $(redis-cli -u "$REDIS_QUEUE" hget "rq:job:$JOB" started_at): $(redis-cli -u "$REDIS_QUEUE" hget "rq:job:$JOB" description | cut -c1-160)"
              if [ "$attempt" -eq 40 ]; then echo "Deploy stopped: the long job did not finish in 20 minutes. Nothing was changed."; exit 1; fi
              sleep 30
            done

            cd $BENCH/apps/one_fm
            git pull upstream version-15
            cd $BENCH
            trap 'status=$?; if [ $status -ne 0 ]; then sudo supervisorctl start $WORKERS; sudo supervisorctl restart $NAME-web:; fi' EXIT

            # Workers and the scheduler write Scheduled Job Log while migrate deletes from it.
            sudo supervisorctl stop $WORKERS
            # A scheduler orphaned by an earlier stop holds the lock supervisor's scheduler needs; [s] keeps pkill off this script.
            pkill -f "$BENCH/env/bin/python -m frappe.utils.bench_helper frappe [s]chedule" || true
            bench migrate
            bench build --app one_fm
            bench clear-cache
            sudo supervisorctl start $WORKERS
            sudo supervisorctl restart $NAME-web:
