name: Server Tests with Coverage

on:
  pull_request:
    branches: [staging, test-production, version-15]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-one_fm-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server Tests with Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379
      redis-socketio:
        image: redis:7-alpine
        ports:
          - 12000:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server mariadb-client xvfb libfontconfig wkhtmltopdf
      - name: Install bench and coverage tools
        run: |
          pip install frappe-bench pytest-cov coverage
      - name: Setup bench
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-15 --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          bench set-mariadb-host 127.0.0.1
          bench set-redis-cache-host 127.0.0.1:13000
          bench set-redis-queue-host 127.0.0.1:11000
          bench set-redis-socketio-host 127.0.0.1:12000
          bench get-app erpnext --branch version-15
          bench get-app hrms --branch version-15
          bench get-app one_fm "$GITHUB_WORKSPACE"
          bench new-site --db-root-password root --admin-password admin --mariadb-root-password root test_site
          bench --site test_site set-config allow_tests true
          bench --site test_site install-app erpnext
          bench --site test_site install-app hrms
          bench --site test_site install-app one_fm
      - name: Run tests with coverage
        run: |
          cd ~/frappe-bench
          coverage run --source apps/one_fm/one_fm -m frappe.commands.utils run-tests --app one_fm --site test_site --failfast
          coverage report --fail-under=30
          coverage xml
