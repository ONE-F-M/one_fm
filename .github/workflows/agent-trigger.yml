name: "🚀 Trigger AI Agent (Cloud Run)"

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to solve (e.g. 94)'
        required: true
        type: string
      base_branch:
        description: 'Base branch (default: staging)'
        required: false
        default: 'staging'
        type: string

jobs:
  invoke-agent:
    # Ensure one agent run per issue to avoid race conditions
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number || github.event.issue.number }}
      cancel-in-progress: true

    # Run if onefm_developer_staging or onefm_developer_hotfix label is present, or if manually triggered
    if: >-
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.labels.*.name, 'onefm_developer_staging') || contains(github.event.issue.labels.*.name, 'onefm_developer_hotfix'))) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && (github.event.label.name == 'onefm_developer_staging' || github.event.label.name == 'onefm_developer_hotfix'))
    
    # Run on standard GitHub-hosted runner for Cloud Run invocation
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write # Required for GCP OIDC Authentication

    steps:
      - name: 🔐 Check User Permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/$ACTOR/permission" --jq '.permission')
          if [[ "$PERMISSION" != "admin" && "$PERMISSION" != "write" ]]; then
            echo "Error: User $ACTOR does not have write access."
            exit 1
          fi

      - name: 🔐 Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@55bd3a7c6e2ae7cf1877fd1ccb9d54c0503c457c # v2.1.2
        with:
          token_format: 'id_token'
          id_token_audience: ${{ secrets.CLOUD_RUN_URL }}
          id_token_include_email: true
          workload_identity_provider: ${{ secrets.GCP_WIDP }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: 🛠️ Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: 🤖 Invoke Agent on Cloud Run
        env:
          CLOUD_RUN_URL: ${{ secrets.CLOUD_RUN_URL }}
          ISSUE_NUM: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number || github.event.issue.number }}
          ACTOR: ${{ github.actor }}
          GCP_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          if ! [[ "$ISSUE_NUM" =~ ^[0-9]+$ ]]; then
            echo "Error: Issue number '$ISSUE_NUM' is not a valid number."
            exit 1
          fi

          # Determine base branch from label or workflow_dispatch input
          BASE_BRANCH="staging"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BASE_BRANCH="${{ github.event.inputs.base_branch }}"
          elif [[ "${{ github.event.label.name }}" == "onefm_developer_hotfix" ]] || \
               echo '${{ toJSON(github.event.issue.labels.*.name) }}' | jq -e '. | index("onefm_developer_hotfix")' > /dev/null 2>&1; then
            BASE_BRANCH="version-15"
          fi

          echo "Connecting to: $CLOUD_RUN_URL"
          echo "Requesting fix for Issue #$ISSUE_NUM (base: $BASE_BRANCH)"
          echo ""
          echo "💡 NOTE: The AI agent can take 2-15 minutes to complete its reasoning loop."
          echo "📖 VIEW REAL-TIME LOGS HERE:"
          echo "https://console.cloud.google.com/run/detail/${{ secrets.GCP_LOCATION || 'us-central1' }}/onefm-agent/observability/logs?project=${{ secrets.GCP_PROJECT_ID || 'ai-agents-10' }}"
          echo ""
          echo "Waiting for agent to finish..."

          PAYLOAD=$(jq -n \
            --arg input "Solve GitHub issue #$ISSUE_NUM" \
            --arg requester "$ACTOR" \
            --arg base_branch "$BASE_BRANCH" \
            '{input: $input, requester: $requester, base_branch: $base_branch}')

          # Retry loop — handles 503 "Container busy" responses.
          # When the container lock blocks a request, we wait and retry so
          # Cloud Run has time to spin up a fresh container for this issue.
          MAX_ATTEMPTS=8
          ATTEMPT=0
          WAIT=15

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — calling ${CLOUD_RUN_URL}/query..."

            HTTP_CODE=$(curl -s -o /tmp/agent_response.json -w "%{http_code}" \
              -X POST "${CLOUD_RUN_URL}/query" \
              -H "Authorization: Bearer $GCP_ID_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")

            echo "HTTP $HTTP_CODE — Response: $(cat /tmp/agent_response.json)"

            if [ "$HTTP_CODE" -eq 202 ]; then
              echo "✅ Agent accepted the request. Pipeline started for issue #$ISSUE_NUM."
              break
            elif [ "$HTTP_CODE" -eq 503 ]; then
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "⏳ Container busy — waiting ${WAIT}s for Cloud Run to scale a fresh container..."
                sleep $WAIT
                # Exponential backoff: 15s → 30s → 60s (capped)
                WAIT=$(( WAIT * 2 > 60 ? 60 : WAIT * 2 ))
              else
                echo "❌ Container still busy after $MAX_ATTEMPTS attempts. Manual retry required."
                exit 1
              fi
            else
              echo "❌ Unexpected HTTP $HTTP_CODE from agent."
              cat /tmp/agent_response.json
              exit 1
            fi
          done
